name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set the site base path
        id: base
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository" == "$owner.github.io" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repository/" >> "$GITHUB_OUTPUT"
          fi

      - name: Check local image files
        shell: bash
        run: |
          for image in Logo.jpg hero-unsplash.jpg 2.png 3.png 4.png 5.png 6.png 7.png 8.png 9.png; do
            if [[ ! -f "src/assets/$image" ]]; then
              echo "Missing src/assets/$image. Restore the original image files from Lovable before publishing." >&2
              exit 1
            fi
          done

      - name: Build static site
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Prepare Pages artifact
        id: artifact
        shell: bash
        run: |
          for candidate in dist/client dist .output/public; do
            if [[ -f "$candidate/index.html" ]]; then
              touch "$candidate/.nojekyll"
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No static index.html was produced by the build." >&2
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.artifact.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
